<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#231f20" />
  <title>Pay invoice — GQ Electrical Services</title>
  <link rel="icon" type="image/svg+xml" href="/brand/logo-icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/site.css" />
</head>
<body>
  <header class="nav light">
    <a class="nav-brand" href="/" aria-label="GQ Electrical Services">
      <img class="mark" src="/brand/logo-icon.svg" alt="" />
      <span class="nav-word" style="color:#231f20">GQ Electrical</span>
    </a>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/portal">Portal</a>
    </nav>
    <a class="nav-toggle" href="/portal">Portal</a>
  </header>

  <div class="page-head">
    <div class="wrap">
      <p class="eyebrow" style="color:rgba(255,255,255,0.5)">Checkout</p>
      <h1 id="pay-title">Pay invoice</h1>
      <p id="pay-sub">A record is written to the shop the moment you confirm. Card networks are not charged yet.</p>
    </div>
  </div>

  <div class="page-body">
    <div class="wrap pay-box" id="root">
      <p class="meta">Loading invoice…</p>
    </div>
  </div>

  <footer class="site-foot">
    <div class="wrap">
      <div class="foot-brand">
        <img src="/brand/logo-icon-white.svg" alt="" />
        <span>GQ Electrical</span>
      </div>
      <div class="foot-copy">Where Guaranteed Meets Quality.</div>
    </div>
  </footer>
  <script src="/pay.js"></script>
</body>
</html>
