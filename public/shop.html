<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#231f20" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="GQ Electrical" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GQ Electrical Services — Shop Office</title>
  <link rel="icon" type="image/svg+xml" href="/brand/logo-icon.svg" />
  <link rel="apple-touch-icon" href="/brand/logo-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/" aria-label="GQ Electrical Services home">
        <img class="brand-logo" src="/brand/logo-horizontal.svg" alt="GQ Electrical" />
      </a>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="side-foot">
        <img class="brand-icon" src="/brand/logo-icon.svg" alt="" />
        <span>Where Guaranteed Meets Quality.</span>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <a class="top-logo" href="#/" aria-label="Home">
          <img src="/brand/logo-icon.svg" alt="" />
        </a>
        <div class="top-title" id="top-title">Shop office</div>
        <a class="icon-btn" href="#/quotes/new" aria-label="New quote">+</a>
      </header>
      <main id="view" class="view"></main>
    </div>

    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <div class="sheet" id="sheet" hidden>
    <button class="sheet-backdrop" id="sheet-close" type="button" aria-label="Close menu"></button>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-brand">
        <img src="/brand/logo-horizontal.svg" alt="GQ Electrical" />
      </div>
      <nav class="sheet-nav" id="sheet-nav"></nav>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="/app.js"></script>

</body>
</html>
